<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stack Rush</title>
<meta name="description" content="One-thumb tower stacking game with endless levels. Works offline.">
<meta name="theme-color" content="#F4EFE6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stack Rush">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="title">
<canvas id="cv" role="img" aria-label="Stack Rush game board"></canvas>
<div class="bottom-fade"></div>

<div id="hud">
  <div id="score">0</div>
  <div id="lv">Level 1</div>
  <div id="bar"><i id="barf"></i></div>
  <div id="pop"></div>
</div>
<div id="banner" aria-live="polite"><b id="bt"></b><span id="bs"></span></div>
<p id="hint">Tap anywhere to drop</p>

<section id="title" class="screen">
  <div>
    <p class="lbl">Best: <b id="b1">0</b> blocks, level <b id="b2">1</b></p>
    <h1>Stack<br>Rush</h1>
    <p class="sub">One thumb. Perfect drops. Don’t miss.</p>
  </div>
  <div class="bot">
    <button id="go">Tap to start</button>
    <p class="lbl">Works offline once loaded</p>
  </div>
</section>

<section id="over" class="screen">
  <div class="card" role="dialog" aria-label="Game over">
    <p class="lbl">Game over</p>
    <div id="fs">0</div>
    <p id="nb"></p>
    <p class="lbl" id="stat"></p>
    <p class="lbl">Best: <b id="fb">0</b></p>
    <button id="again">Play again</button>
    <button id="share" class="alt">Share score</button>
  </div>
</section>

<script src="game.js"></script>
</body>
</html>
